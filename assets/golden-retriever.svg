  <!-- legs -->
  <rect x="78" y="108" width="14" height="36" rx="7" fill="#e8a940"/>
  <rect x="96" y="112" width="14" height="32" rx="7" fill="#d9952f"/>
  <rect x="128" y="110" width="14" height="34" rx="7" fill="#e8a940"/>
  <rect x="146" y="108" width="14" height="34" rx="7" fill="#d9952f"/>
