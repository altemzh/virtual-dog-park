<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-labelledby="t">
  <title id="t">Illustration of a Beagle</title>
  <!-- ground shadow -->
  <ellipse cx="100" cy="146" rx="70" ry="7" fill="#000" opacity="0.08"/>
  <!-- tail -->
  <path d="M150 82 Q172 58 166 40" stroke="#8a5a2b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="166" cy="40" r="5" fill="#fff"/>
  <!-- body -->
  <ellipse cx="112" cy="96" rx="44" ry="26" fill="#fff"/>
  <path d="M86 76 Q112 66 148 80 Q150 96 132 98 Q104 96 86 90 Z" fill="#3b2a1e"/>
  <!-- legs -->
  <rect x="80" y="110" width="12" height="32" rx="6" fill="#fff" stroke="#e6ddd2"/>
  <rect x="98" y="112" width="12" height="30" rx="6" fill="#fff" stroke="#e6ddd2"/>
  <rect x="124" y="110" width="12" height="32" rx="6" fill="#fff" stroke="#e6ddd2"/>
  <rect x="140" y="108" width="12" height="32" rx="6" fill="#fff" stroke="#e6ddd2"/>
  <!-- head -->
  <ellipse cx="62" cy="70" rx="30" ry="27" fill="#c98a4b"/>
  <path d="M60 46 L66 46 L68 96 L56 96 Z" fill="#fff"/>
  <ellipse cx="50" cy="88" rx="20" ry="14" fill="#fff"/>
  <!-- long ear -->
  <path d="M78 56 Q98 64 92 104 Q82 108 76 96 Q72 74 78 56 Z" fill="#8a5a2b"/>
  <!-- face -->
  <circle cx="52" cy="66" r="4" fill="#2a1d14"/>
  <circle cx="53" cy="65" r="1.3" fill="#fff"/>
  <ellipse cx="34" cy="84" rx="7" ry="5" fill="#2a1d14"/>
  <path d="M40 94 Q48 100 56 94" stroke="#2a1d14" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
